{% extends 'base.html' %}
{% load static %}

{% block titulo %}Publicar aviso | Mini Mural{% endblock %}

{% block conteudo %}
<h1>Publicar aviso</h1>
{% for erro in form.texto.errors %}<p class="recusa">{{ erro }}</p>{% endfor %}
<form method="post" action="{% url 'criar' %}">
  {% csrf_token %}
  <div class="campo{% if form.texto.errors %} campo-com-erro{% endif %}">
    <label for="{{ form.texto.id_for_label }}">{{ form.texto.label }}</label>
    {{ form.texto }}
    <p class="dica" id="contador" aria-live="polite">Até {{ limite }} caracteres.</p>
  </div>
  <button type="submit">Publicar</button>
  <a href="{% url 'mural' %}">Voltar ao mural</a>
</form>
<script src="{% static 'js/contador.js' %}"></script>
{% endblock %}
