{% extends 'base.html' %}

{% block titulo %}Sair | Mini Mural{% endblock %}

{% block conteudo %}
<h1>Sair</h1>
{% if user.is_authenticated %}
<p>Para sair da conta, use o botão abaixo.</p>
<form method="post" action="{% url 'sair' %}">
  {% csrf_token %}
  <button type="submit">Sair</button>
</form>
{% else %}
<p>Você não está em uma conta. <a href="{% url 'entrar' %}">Entrar</a></p>
{% endif %}
{% endblock %}
